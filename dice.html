<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GameLogs — wylosuj następną grę z biblioteki.">
    <title>GameLogs — losuj grę</title>
    <link rel="stylesheet" href="style.css?v=20261016-3">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <script type="module" src="script.js?v=20261016-3"></script>
</head>
<body data-page="dice">
    <header class="site-header">
        <div class="nav-shell">
            <a class="brand" href="index.html" aria-label="GameLogs — strona główna">game<span>logs</span></a>
            <nav class="primary-nav" aria-label="Główna nawigacja">
                <a href="index.html#biblioteka">Biblioteka</a>
                <a href="index.html#dziennik">Dziennik</a>
                <a class="is-active" href="dice.html">Losuj grę</a>
            </nav>
            <button class="icon-button" id="themeToggle" type="button" aria-label="Włącz jasny motyw" aria-pressed="false"><img id="themeIcon" src="svg/sun.png" alt=""></button>
        </div>
    </header>
    <main class="dice-page page-width">
        <section class="dice-intro" aria-labelledby="diceTitle">
            <p class="eyebrow">Decyzja na dziś</p>
            <h1 id="diceTitle">Nie wiesz, w co zagrać?</h1>
            <p>Kość wylosuje jedną grę z Twojej lokalnej biblioteki. Wybierz źródło i daj się zaskoczyć.</p>
        </section>
        <section class="dice-panel" aria-label="Generator losowej gry">
            <div class="dice-face" id="diceFace" aria-hidden="true">⚄</div>
            <label class="dice-source">Losuj z
                <select id="diceSource">
                    <option value="backlog">backlogu</option>
                    <option value="all">całej biblioteki</option>
                    <option value="playing">gier, w które gram</option>
                </select>
            </label>
            <button class="button button-primary dice-button" id="rollButton" type="button">Rzuć kością</button>
            <p class="dice-message" id="diceMessage" aria-live="polite">Wybierz źródło i wylosuj następną historię.</p>
            <article class="random-result" id="randomResult" hidden></article>
        </section>
    </main>
    <footer class="site-footer"><p>GameLogs <span>·</span> lokalny dziennik gier</p></footer>
</body>
</html>
